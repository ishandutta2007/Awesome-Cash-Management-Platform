<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Flow Dynamic Line Gradient -->
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Background Wave / Flow Dynamic Line (Background Layer) -->
  <path d="M 0,220 Q 300,140 600,210 T 1200,160 L 1200,320 L 0,320 Z" fill="url(#flowLine)">
    <animate attributeName="d" 
             dur="8s" 
             repeatCount="indefinite" 
             values="M 0,220 Q 300,140 600,210 T 1200,160 L 1200,320 L 0,320 Z;
                     M 0,190 Q 300,250 600,170 T 1200,210 L 1200,320 L 0,320 Z;
                     M 0,220 Q 300,140 600,210 T 1200,160 L 1200,320 L 0,320 Z" />
  </path>

  <!-- Decorative Chart Grid Lines (Background Layer) -->
  <g opacity="0.15" stroke="#ffffff" stroke-dasharray="4 4" stroke-width="1">
    <line x1="80" y1="60" x2="1120" y2="60" />
    <line x1="80" y1="120" x2="1120" y2="120" />
    <line x1="80" y1="180" x2="1120" y2="180" />
    <line x1="80" y1="240" x2="1120" y2="240" />
  </g>

  <!-- Animated Pulse Nodes (Positioned safely below/behind text or to sides) -->
  <circle cx="950" cy="110" r="6" fill="#34d399">
    <animate attributeName="r" values="4;10;4" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="180" r="5" fill="#38bdf8">
    <animate attributeName="r" values="3;8;3" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Glassmorphism Cards (Flanking Right Side to avoid hiding Title) -->
  <g transform="translate(820, 50)">
    <rect width="320" height="85" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">GLOBAL LIQUIDITY POSITION</text>
    <text x="20" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#34d399">$142,850,000</text>
    <path d="M 230,55 L 250,40 L 270,48 L 295,30" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g transform="translate(820, 155)">
    <rect width="320" height="85" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">BANK CONNECTIVITY &amp; TMS</text>
    <text x="20" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">Multi-Bank Real-Time</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Title & Subtitle (Clear, Crisp & Unobstructed) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.5" />
      <text x="130" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">CURATED TREASURY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Cash Management
    </text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
      &amp; Treasury Platforms
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" opacity="0.9">
      Enterprise SaaS Solutions, Liquidity Forecasting &amp; Open-Source Financial Tools
    </text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="314" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
